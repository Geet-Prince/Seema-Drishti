# Alarm Manager — Threat Scoring Rules
# Add/modify rules here without touching any Python code.
# Scores add up to form a total Danger Level per track_id.

rules:
  - name: "Human Detected"
    module: human_detection
    score: 20
    severity: informational
    capture_snapshot: false

  - name: "Human Tracked"
    module: human_tracking
    object_type: human
    score: 20
    severity: informational
    capture_snapshot: false

  - name: "Vehicle Tracked"
    module: human_tracking
    object_type: vehicle
    score: 20
    severity: informational
    capture_snapshot: false

  - name: "Virtual Fence Breach"
    module: human_tracking
    object_type: human
    attribute: zone_state
    equals: inside
    score: 40
    severity: high
    capture_snapshot: true

  - name: "Vehicle Fence Breach"
    module: human_tracking
    object_type: vehicle
    attribute: zone_state
    equals: inside
    score: 40
    severity: high
    capture_snapshot: true

  - name: "Watchlist Plate Detected"
    module: human_tracking
    object_type: vehicle
    attribute: watchlist_match
    equals: true
    score: 85
    severity: critical
    capture_snapshot: true

  - name: "Suspicious Activity"
    module: suspicious_activity
    score: 35
    severity: medium
    capture_snapshot: true

  - name: "ANPR Watchlist Hit"
    module: anpr
    attribute: watchlist_match
    equals: true
    score: 50
    severity: critical
    capture_snapshot: true

  - name: "Vehicle Detected"
    module: vehicle_detection
    score: 25
    severity: informational
    capture_snapshot: false

  - name: "Loitering"
    module: human_tracking
    attribute: activity
    equals: loitering
    score: 35
    severity: medium
    capture_snapshot: true

  - name: "Erratic Movement"
    module: human_tracking
    attribute: activity
    equals: erratic_movement
    score: 30
    severity: medium
    capture_snapshot: true

  - name: "Crowd Formation"
    module: human_tracking
    attribute: activity
    equals: crowd_formation
    score: 35
    severity: medium
    capture_snapshot: true

# Danger thresholds
thresholds:
  low: 20       # Green
  medium: 40    # Yellow
  high: 60      # Orange
  critical: 80  # Red
