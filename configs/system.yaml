# System Configuration
# ====================
# All tunable numbers live here — never hardcoded inside module code.
# Owner: Prince (architecture)

alarm:
  dedup_window_seconds: 45         # same (camera_id, track_id, module) within this window → one record
  pre_event_buffer_seconds: 10     # seconds of rolling buffer to prepend to evidence clip
  post_event_buffer_seconds: 20    # seconds of fresh recording to append to evidence clip
  activity_log_retention_days: 30  # continuous activity_log rows pruned after this
  event_evidence_retention_days: 365  # evidence clips/snapshots kept for 1 year

sync:
  retry_backoff_seconds: 30        # initial retry delay for the offline sync worker
  max_retry_backoff_seconds: 3600  # cap on exponential backoff

cameras:
  - id: CAM_01
    name: "North Fence Gate"
    rtsp_url: "rtsp://192.168.1.101:554/stream"   # replace with real URL
    zones:
      - id: north-fence
        polygon: [[120, 80], [500, 80], [500, 400], [120, 400]]

  - id: CAM_02
    name: "South Entry Road"
    rtsp_url: "rtsp://192.168.1.102:554/stream"
    zones:
      - id: south-road
        polygon: [[50, 100], [630, 100], [630, 480], [50, 480]]

# Model state: Experimental | Candidate | Approved | Deprecated
# Each module's inference/ folder reads its own section.
models:
  human_detection:
    state: Experimental
    weights: "models/current/best.pt"
    confidence_threshold: 0.5
    device: "auto"   # "auto" | "cpu" | "cuda:0" | "mps" (auto = NVIDIA TensorRT/CUDA <-> Apple CPU)

  human_tracking:
    state: Experimental
    tracker: "bytetrack"   # bytetrack | deepsort

  vehicle_detection:
    state: Experimental
    weights: "models/current/best.pt"
    confidence_threshold: 0.5
    device: "auto"

  anpr:
    state: Experimental
    ocr_engine: "paddleocr"   # paddleocr | easyocr
    watchlist_path: "configs/watchlist_plates.txt"

  virtual_fence:
    state: Experimental
    # No model weights — pure geometry (point-in-polygon on track centroids)

  suspicious_activity:
    state: Experimental
    loitering_threshold_seconds: 30
    speed_anomaly_factor: 3.0

  face_analysis:
    state: Experimental
    weights: "models/current/best.pt"
    confidence_threshold: 0.6
    trigger: "virtual_fence_entry"   # only runs on zone-entry events — never per-frame
